services:
  - type: web
    name: springpath-api
    env: docker
    dockerfilePath: ./backend/Dockerfile.render
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: JWT_SECRET
        generateValue: true
      - key: DB_URL
        fromDatabase:
          name: springpath-db
          property: connectionString
      - key: DB_USER
        fromDatabase:
          name: springpath-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: springpath-db
          property: password
    healthCheckPath: /actuator/health
    plan: free

  - type: web
    name: springpath-frontend
    env: static
    buildCommand: cd frontend && npm ci --legacy-peer-deps && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://springpath-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://springpath-api.onrender.com
    plan: free

databases:
  - name: springpath-db
    plan: free
    databaseName: springpath
    user: springpath
