services:
  - type: web
    name: springpath-api
    env: docker
    dockerfilePath: ./backend/Dockerfile.render
    plan: starter
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: JWT_SECRET
        generateValue: true
      - key: DB_URL
        fromDatabase:
          name: springpath-db
          property: connectionString
      - key: DB_USER
        fromDatabase:
          name: springpath-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: springpath-db
          property: password
    healthCheckPath: /actuator/health

databases:
  - name: springpath-db
    plan: free
    databaseName: springpath
    user: springpath
